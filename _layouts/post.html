---
layout: default
---

<main class="container article-page">
  <a class="back" href="{{ '/' | relative_url }}">← Басты бетке</a>

  <p class="eyebrow" style="margin-top:45px">QANYSH · ҒЫЛЫМ</p>
  <h1>{{ page.title }}</h1>
  <div class="article-meta">
    {{ page.date | date: "%d.%m.%Y" }} · QANYSH редакциясы
  </div>

  {% if page.image %}
  <img class="article-image" src="{{ page.image | relative_url }}" alt="{{ page.title }}">
  {% endif %}

  <div class="article-body">
    {{ content }}
  </div>
</main>
